name: Publish npm package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksum: ${{ steps.pack.outputs.checksum }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate release tooling
        run: |
          pnpm --dir .github/release-tooling i --frozen-lockfile --ignore-scripts
          node --check .github/release-tooling/release.config.cjs
          node -e "require('./.github/release-tooling/release.config.cjs')"
          node --test .github/release-tooling/verify-registry.mjs
      - name: Pack the tested source
        id: pack
        run: |
          set -euo pipefail
          mkdir -p artifact
          npm pack --ignore-scripts --pack-destination artifact
          mv artifact/*.tgz artifact/package.tgz
          echo "checksum=$(sha256sum artifact/package.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: artifact/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      # No application dependency install or application code execution here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifact
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify artifact checksum
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.checksum }}
        run: |
          set -euo pipefail
          printf '%s  artifact/package.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Install locked release tools without lifecycle scripts
        run: pnpm --dir .github/release-tooling i --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: Unpack verified package
        run: tar -xzf artifact/package.tgz -C artifact
      - name: Semantic Release
        run: node .github/release-tooling/node_modules/semantic-release/bin/semantic-release.js --extends ./.github/release-tooling/release.config.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
