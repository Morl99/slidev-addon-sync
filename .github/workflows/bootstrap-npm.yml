name: Bootstrap npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub release version to publish on npm (without v)
        required: true
        default: '1.0.0'
        type: string
  pull_request:
    paths:
      - '.github/workflows/bootstrap-npm.yml'

permissions: {}
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksum: ${{ steps.pack.outputs.checksum }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate version and release ancestry
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          const commit = execFileSync('git', ['rev-parse', '--verify', `refs/tags/v${version}^{commit}`], {encoding:'utf8'}).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', commit, 'HEAD']);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: pnpm i --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Pack tested source with bootstrap metadata
        id: pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging artifact
          npm pack --ignore-scripts --pack-destination staging
          tar -xzf staging/*.tgz -C staging
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path = 'staging/package/package.json';
          const pkg = JSON.parse(fs.readFileSync(path));
          assert.equal(pkg.name, '@morl99/slidev-addon-sync');
          pkg.version = process.env.RELEASE_VERSION;
          pkg.publishConfig = {registry: 'https://registry.npmjs.org/', access: 'public'};
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm pack ./staging/package --ignore-scripts --pack-destination artifact
          mv artifact/*.tgz artifact/package.tgz
          echo "checksum=$(sha256sum artifact/package.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-npm-package
          path: artifact/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # No checkout, dependency installation or lifecycle scripts in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bootstrap-npm-package
          path: artifact
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify checksum
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.checksum }}
        run: |
          set -euo pipefail
          printf '%s  artifact/package.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Require a new npm package
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://registry.npmjs.org/@morl99%2fslidev-addon-sync', {signal: AbortSignal.timeout(30000)});
          if (response.status !== 404) {
            throw new Error(`Bootstrap requires an absent package (HTTP 404), got ${response.status}. Use Trusted Publishing for existing packages.`);
          }
          JS
      - name: Publish initial package
        working-directory: artifact
        run: npm publish ./package.tgz --ignore-scripts --access=public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
