version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: fix
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.github/release-tooling
    schedule:
      interval: weekly
